# ===================================================
# kitty-theme.conf — Violet Drift
# A dark, purple/blue themed colorscheme for kitty
# ===================================================

# ----- Basic colors -----
foreground              #d9c9ff
background              #17111f
selection_foreground    #17111f
selection_background    #9d7bff

# ----- Cursor -----
cursor                  #b6a0ff
cursor_text_color       #17111f

# ----- URL underline color -----
url_color               #6f8bff

# ----- Kitty window border colors -----
active_border_color     #9d7bff
inactive_border_color   #332750
bell_border_color       #ff8fa3

# ----- Tab bar colors -----
active_tab_foreground   #f5f0ff
active_tab_background   #382a55
inactive_tab_foreground #8a7aa8
inactive_tab_background #1e1730
tab_bar_background      #140f1c

# ----- Marks -----
mark1_foreground #17111f
mark1_background #9d7bff
mark2_foreground #17111f
mark2_background #6f8bff
mark3_foreground #17111f
mark3_background #ffb6f5

# ----- The 16 terminal colors -----

# black
color0  #211a30
color8  #4a3d6b

# red
color1  #ff8fa3
color9  #ffb0c0

# green
color2  #a8ffe0
color10 #c0ffe8

# yellow
color3  #ffe08a
color11 #ffe8a8

# blue
color4  #6f8bff
color12 #93aaff

# magenta
color5  #c9b6ff
color13 #dcc9ff

# cyan
color6  #8ad5ff
color14 #aee2ff

# white
color7  #d9c9ff
color15 #f2ecff

# ----- Background opacity (transparent terminal) -----
background_opacity     0.85
dynamic_background_opacity yes
background_blur        24