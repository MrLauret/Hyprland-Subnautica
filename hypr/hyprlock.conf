source=~/.config/hypr/hyprlock/colors.conf

general {
    hide_cursor = true
    grace = 0
}

background {
    monitor = HDMI-A-1
    path = /home/lau/Pictures/Wallpapers/treeGIMP.png
    color = rgba(21, 17, 66, 1.0)
    blur_passes = 3
    blur_size = 8
    brightness = 0.75
    vibrancy = 0.4
}

input-field {
    monitor =
    size = 280, 52
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.28
    dots_center = true
    outer_color = $entry_border_color
    inner_color = $entry_background_color
    font_color = $entry_color
    fade_on_empty = false
    placeholder_text = <span foreground="##cbb2fe99"><i>ALTERRA AUTH ❯</i></span>
    check_color = rgba(60, 229, 255, 0.95)
    fail_color = rgba(255, 77, 141, 0.95)
    fail_text = <i>ACCESS DENIED ($ATTEMPTS)</i>
    rounding = 16

    position = 0, 20
    halign = center
    valign = center
}

label { # Clock
    monitor =
    text = $TIME
    color = rgba(60, 229, 255, 1.0)
    font_size = 68
    font_family = $font_family_clock
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(15, 10, 45, 0.8)

    position = 0, 300
    halign = center
    valign = center
}

label { # Date
    monitor =
    text = cmd[update:5000] date +"%A, %B %d"
    color = rgba(203, 178, 254, 0.95)
    font_size = 17
    font_family = $font_family_clock
    shadow_passes = 1

    position = 0, 240
    halign = center
    valign = center
}

label { # Caps Lock Warning
    monitor =
    text = cmd[update:250] ${XDG_CONFIG_HOME:-$HOME/.config}/hypr/hyprlock/check-capslock.sh
    color = rgba(255, 77, 141, 1.0)
    font_size = 13
    font_family = $font_family

    position = 0, -25
    halign = center
    valign = center
}

label { # User
    monitor =
    text =     $USER
    color = $text_color
    font_size = 18
    font_family = $font_family
    shadow_passes = 1

    position = 0, 50
    halign = center
    valign = bottom
}

label { # Status
    monitor =
    text = cmd[update:5000] ${XDG_CONFIG_HOME:-$HOME/.config}/hypr/hyprlock/status.sh
    color = rgba(203, 178, 254, 0.9)
    font_size = 14
    font_family = $font_family

    position = 30, -30
    halign = left
    valign = top
}

label { # Keyboard Layout
    monitor =
    text = $LAYOUT
    color = rgba(203, 178, 254, 0.85)
    font_size = 14
    font_family = $font_family

    position = -30, 30
    halign = right
    valign = bottom
}

