# ===================================================
# kitty-theme.conf — Violet Drift (Alterra PDA Edition)
# A dark, purple/indigo-blue themed colorscheme for kitty
# ===================================================

# ----- Basic colors -----
foreground              #e6e4ff
background              #131036
selection_foreground    #0b0924
selection_background    #a882ff

# ----- Cursor -----
cursor                  #3ce5ff
cursor_text_color       #131036

# ----- URL underline color -----
url_color               #3ce5ff

# ----- Kitty window border colors -----
active_border_color     #a882ff
inactive_border_color   #2a2259
bell_border_color       #ff4d8d

# ----- Tab bar colors -----
active_tab_foreground   #131036
active_tab_background   #3ce5ff
inactive_tab_foreground #cbb2fe
inactive_tab_background #1b164a
tab_bar_background      #0e0c29

# ----- Marks -----
mark1_foreground #0b0924
mark1_background #a882ff
mark2_foreground #0b0924
mark2_background #3ce5ff
mark3_foreground #0b0924
mark3_background #ff4d8d

# ----- The 16 terminal colors -----

# black
color0  #1e194d
color8  #4b428a

# red
color1  #ff6b9d
color9  #ff8fb5

# green
color2  #6ef7c8
color10 #9effde

# yellow
color3  #ffe08a
color11 #ffeaa8

# blue
color4  #6f8bff
color12 #93aaff

# magenta
color5  #c084fc
color13 #d8b4fe

# cyan
color6  #3ce5ff
color14 #7eefff

# white
color7  #e6e4ff
color15 #f7f5ff

# ----- Background opacity (transparent terminal) -----
background_opacity     0.60
dynamic_background_opacity yes
background_blur        20

